name: Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated tests
        run: python -m unittest -v test_app

      - name: Build Docker image
        run: docker build -t devx-demo:${{ github.sha }} .

      - name: Export image for scanning
        run: docker save devx-demo:${{ github.sha }} -o image.tar

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/scan:ro" \
            aquasec/trivy:0.76.0 image \
            --input /scan/image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1